<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colosseum Opening</title>
<meta name="description" content="Drop your logo. It finds your tile in the Crypto World's Fair mosaic and builds your opening video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Trios RGB em vez de hex, pra que rgba(var(--ac1), .5) funcione.
       A paleta e trocada no #palco, nao aqui, entao a interface da pagina
       nao pisca de cor junto com o video. */
    --ac1:56,189,248; --ac2:37,99,235;
    --ciano:rgb(var(--ac1)); --azul:rgb(var(--ac2));
    --texto:#cfe0f0; --fraco:#71869c;
    --r:1;              /* multiplicador de ritmo - ver "ritmo" abaixo */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:#05070b; color:var(--texto);
    font-family:"Jost",system-ui,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px; gap:16px;
  }

  /* ======================= O PALCO (1:1) ======================= */
  #palco{
    position:relative; overflow:hidden; background:#000; flex:none;
    width:min(100%, 78vh); aspect-ratio:1/1;
    font-size:calc(min(100%, 78vh) / 100);
    border-radius:10px;
  }
  /* no fullscreen o palco ocupa a tela e nada mais aparece */
  #palco:fullscreen{width:100vh; max-width:100vw; border-radius:0; font-size:calc(min(100vw,100vh)/100);}

  /* Miniatura de 64px embutida no HTML: pinta junto com a pagina, antes de
     qualquer download. Sem ela o visitante encara um quadrado preto pelos
     ~3s que os 2 MB do mosaico levam pra chegar - e essa e a primeira
     impressao de quem clica no link do post. */
  /* Acima da cortina (z-index 9), que e preta e opaca ate a animacao
     comecar - sem isto a miniatura ficava escondida atras dela e nao
     adiantava nada. */
  #previa{
    position:absolute; inset:0; z-index:10; background-size:100% 100%;
    background-image:url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCABAAEADASIAAhEBAxEB/8QAGQAAAgMBAAAAAAAAAAAAAAAAAwQAAQIF/8QALhAAAgIBBAEDAwQCAgMAAAAAAQIDEQQAEiExEwVBUSJxgSMyYZEUQiSxgqHx/8QAFgEBAQEAAAAAAAAAAAAAAAAAAQAC/8QAHBEAAwEAAwEBAAAAAAAAAAAAAAERAiExQWFx/9oADAMBAAIRAxEAPwDh5cV5Esk4SQTsieU2oaiP1QetpPBY886GcbIgy5p8fGmC79rRttVZypB8YVTyOOhq2hE7vkiOQHHnIaCB7SJA1kIfj/71zrE+Syq00PnjhCopWeMkMlhgL/H2r30qgSMLHInqcUDDflkKjT+MrwR7cqATyf4GqnbKyBHN/k+LImIiaIE3Ku4lGX5Wwf6HzpXJ88MjBcdsZySpVT+mQKbg+545/GnD6lmRw5M+ZFF/yHQEHg7lohhXQrg+xvU7aXQKdsCTZLmLk5eSWZJ1JN2D+6+/gV/ftrORi5Ahx8zKSUwysQPIQxBFDrugNvencRsqQsmVkLEma5aRJoylDg7VYjsjb1x+3SzvXqjRyRlA/wCmUCgMqnrgmj/N8HQqJiXyhciRcrGMakXtUBiw6CKP6v4AB0eWXlFfHxvKgMgO0PGB3QU/tYn/AF9tY9OXFhzcdpTO8cUpR3Rjamz9VgH7UO6OmVnT1L1B40HhMYAg3WWjU8ttUCi3df0L1t90POQfp7R7PLJK0uSUUQCIbRFt5AJNCyBVC7GtSwwZMiQz5MeNJ4gGaGil0SVY32K4r7ak6yRK3kQHNWpJ1dqRG3irFchvav71meWGeUbUiZ3PBbGKB2J6sE2KvocgGtDZQHmS5B9SRHiikaQOS6gBZBtIZhZHFdfnQ/TInjqRcZmWZTUsj0NgKhqP5Wz7a6fp+LNk5n+W0i5NOYvGAAKUWNvvW4KOvf76XXPyWrHOMYmWUu7yE0vPKgV1zVf96zqDhNuINk5ogdnWfHyGaRFiaTcfGosMoaq+PxXeks6PBw5UMsDyQyMS/wBRRo2HO3d2RRU9dEdVpo5ORJNJEJUiAbfCE2rEq/8AlyK5+bLe1a5b7zMHyYm27yQCWUv10SCD7f1qUa4LWXlx9msqLci5LOFEkoZXVgQAQNoskEgdcCuO70z+nkJLBiSytNLMpeeysSAcWeLokdmq99Q5OUGGPvXJkjLBVEY5DE7wP+6+Sa0DKKpXmE4VYyFiMm4xr0u6gARfPfIOryIJGYikiErZDrNkbkuRQx+j4N0fxfANa6eb50z6RWjwXcRxsCHVtvMagA7gex2LvXNxyQxCTwxAsYZCGZTOrGroew1W2TEyEA2xhWRx423MrDkEfJ9ufnS+UK7HPHNF6os4MZedNzob/VsGylVS2BfIr+dEYZM/qIErxRERL5pXc7ZAT+4e98AcDmtBjxW9SkgOMkxQExkSy7toN7TQraDye64P5Z9PMnkGBkHGlDbjHMJLdiCPoLkEiqvjU0WdPLq4YpB5pcqR1WNjjsUQM1CubtWFkm7H2OhLKMxoPM8EYx32qzFy8gHA+m69hxxoxSJsidbbJynTYtOWJeyd1kewAFe9n4Giocf1HPfImwwkY2RSIt7yWWtw57BW/wA83qSjha23yyTsmZkRZDRDGEIZZ0ZypaTcWOxgDyCb/wDXOrkjWKSOSXJj8GSoZ/CC6WG+leeSoP8AI0qs8jSsmRCHmDLGhLsoRujuUccigT2a0eNG     filter:blur(12px) saturate(1.15); transform:scale(1.06);
    transition:opacity .5s;
  }
  #previa.pronto{opacity:0}

  #carregando{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:11; text-align:center; width:62%; transition:opacity .4s;
  }
  #carregando.pronto{opacity:0; pointer-events:none}
  #carregando span{
    display:block; font-size:1.6em; font-weight:300; letter-spacing:.14em;
    color:#bcd2e6; text-shadow:0 1px 10px rgba(0,0,0,.9);
  }
  #barra{
    margin-top:1.1em; height:2px; border-radius:2px;
    background:rgba(255,255,255,.14); overflow:hidden;
  }
  #barra i{
    display:block; height:100%; width:0;
    background:linear-gradient(90deg, rgb(var(--ac2)), rgb(var(--ac1)));
    transition:width .18s linear;
  }

  #camera{position:absolute; inset:0; transform-origin:50% 50%;}
  #empurra{position:absolute; inset:0; transform-origin:0 0;}
  #mosaico{width:100%; height:100%; display:block;}
  /* 3x o palco e centrado na celula: assim o "buraco" claro acompanha ela
     mesmo quando o limite de borda tira a celula do centro da tela.
     As paradas do gradiente estao divididas por 3 pelo mesmo motivo. */
  #foco{position:absolute; left:50%; top:50%; width:300%; height:300%;
    transform:translate(-50%,-50%); opacity:0; pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      rgba(0,0,0,.10) 0%, rgba(0,0,0,.42) 6%, rgba(0,0,0,.68) 14%, rgba(0,0,0,.80) 34%);}
  #anel{position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    border:.2em solid rgba(var(--ac1),.95); border-radius:9%; opacity:0;
    box-shadow:0 0 2.2em rgba(var(--ac1),.55), inset 0 0 1.6em rgba(var(--ac1),.2);}
  .varredura{position:absolute; left:0; right:0; height:2px; top:-5%; opacity:0;
    background:linear-gradient(90deg,transparent,var(--ciano),transparent);
    filter:blur(1.5px); box-shadow:0 0 2.5em rgba(var(--ac1),.5);}

  .aurora{position:absolute; border-radius:50%; opacity:0; pointer-events:none;
    filter:blur(6em); mix-blend-mode:screen;}
  #aurora1{left:22%; top:26%; width:52em; height:52em; background:radial-gradient(circle,rgba(var(--ac2),.55),transparent 65%);}
  #aurora2{left:70%; top:48%; width:44em; height:44em; background:radial-gradient(circle,rgba(var(--ac1),.42),transparent 65%);}
  .pulso{position:absolute; left:50%; top:38%; width:30em; height:30em;
    transform:translate(-50%,-50%) scale(.5);
    border:1px solid rgba(var(--ac1),.5); border-radius:50%; opacity:0; pointer-events:none;}
  #aro{position:absolute; inset:0; opacity:0; pointer-events:none;}
  #aro circle{fill:none; stroke:url(#grad); stroke-width:.45; stroke-linecap:round;
    stroke-dasharray:150.80; stroke-dashoffset:150.80;
    transform:rotate(-90deg); transform-origin:50px 38px;
    filter:drop-shadow(0 0 1px rgba(var(--ac1),.9));}
  #brilho{position:absolute; left:50%; top:38%; width:78em; height:78em;
    transform:translate(-50%,-50%) scale(.55); opacity:0; pointer-events:none;
    background:radial-gradient(circle, rgba(var(--ac2),.42) 0%, rgba(var(--ac1),.13) 36%, transparent 66%);}
  #nitido{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); opacity:0;}
  #nitido.escuro{mix-blend-mode:screen;}
  #nitido.claro{border-radius:4%; background:#fff; padding:1.2%;}

  .linha{position:absolute; left:50%; transform:translateX(-50%); text-align:center; opacity:0; white-space:nowrap;}
  #chapeu{top:7%; font-size:2em; font-weight:300; letter-spacing:.36em; text-indent:.36em; color:#9fb4c9; text-transform:uppercase;}
  #regua{top:66%; width:0; height:1px; background:linear-gradient(90deg,transparent,rgba(var(--ac1),.8),transparent);}
  #titulo{top:70%; font-size:2.5em; font-weight:300; letter-spacing:.4em; text-indent:.4em; color:#dce7f5;}
  #frase{top:78%; font-size:1.7em; font-weight:200; letter-spacing:.1em; text-indent:.1em; color:#8296ad;}
  #rodape{top:90%; font-size:1.5em; font-weight:300; letter-spacing:.3em; text-indent:.3em; color:#55687f; text-transform:uppercase;}
  /* crédito discreto: pequeno, no canto, e removível porque isto é MIT */
  #credito{position:absolute; right:2.5%; bottom:2.2%; font-size:1.05em; font-weight:200;
    letter-spacing:.14em; color:#44566b; opacity:0;}

  /* A vinheta serve ao cartao FINAL. Ligada desde o primeiro quadro ela
     apagava as bordas do plano de abertura - medido: centro em 98% do
     brilho original, mas borda em 34% e canto em 44%. E esse plano existe
     justamente pra mostrar os ~3.000 logos, muitos deles na borda.
     Agora entra junto com a aproximacao, e mais suave. */
  .vinheta{position:absolute; inset:0; z-index:7; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse 82% 82% at 50% 50%, transparent 55%, rgba(0,0,0,.58) 100%);}
  #cortina{position:absolute; inset:0; background:#000; opacity:1; z-index:9; pointer-events:none;}

  /* ============ PALETAS ============
     Trocadas no #palco, nao no :root, pra que a interface da pagina nao
     mude de cor junto com o video. A substituicao de custom property e
     preguicosa, entao --ciano, definido no :root como rgb(var(--ac1)),
     resolve com o --ac1 de QUEM o usa - ou seja, o do palco. */
  #palco.p-ciano   { --ac1:56,189,248;  --ac2:37,99,235;  }
  #palco.p-violeta { --ac1:167,139,250; --ac2:124,58,237; }
  #palco.p-ambar   { --ac1:251,191,36;  --ac2:217,119,6;  }
  #palco.p-verde   { --ac1:52,211,153;  --ac2:5,150,105;  }
  #palco.p-mono    { --ac1:226,232,240; --ac2:148,163,184;}

  /* ============ FINAIS ============
     Tres tratamentos do fundo do cartao. O "limpo" existe porque nem toda
     marca combina com anel de sonar - produto serio costuma ficar melhor
     sem efeito nenhum alem do brilho. */
  #malha{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(var(--ac1),.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--ac1),.075) 1px, transparent 1px);
    background-size:5em 5em;
    mask-image:radial-gradient(ellipse 62% 62% at 50% 38%, #000 18%, transparent 76%);
    -webkit-mask-image:radial-gradient(ellipse 62% 62% at 50% 38%, #000 18%, transparent 76%);
  }
  #palco.f-limpo .pulso, #palco.f-limpo .aurora, #palco.f-limpo #aro,
  #palco.f-grade .pulso, #palco.f-grade .aurora{ display:none; }
  #palco.f-sonar #malha, #palco.f-limpo #malha{ display:none; }

  /* ===================== TIMELINE ===================== */
  .tocando #cortina  {animation:sumir calc(1s*var(--r)) ease-out 0s forwards, aparecer calc(1.6s*var(--r)) ease-in calc(16.4s*var(--r)) forwards}
  .tocando #camera   {animation:respirar calc(4.6s*var(--r)) ease-in-out calc(.6s*var(--r)) forwards, sumir calc(1.3s*var(--r)) ease-in-out calc(9.1s*var(--r)) forwards}
  .tocando #mosaico  {animation:apagar calc(1.7s*var(--r)) ease-in-out calc(5.9s*var(--r)) forwards}
  .tocando .v1       {animation:varrer calc(2.3s*var(--r)) cubic-bezier(.4,0,.2,1) calc(1.0s*var(--r)) forwards}
  .tocando .v2       {animation:varrer calc(1.7s*var(--r)) cubic-bezier(.4,0,.2,1) calc(2.6s*var(--r)) forwards}
  .tocando #chapeu   {animation:subir calc(1.1s*var(--r)) ease-out calc(1.2s*var(--r)) forwards, descer calc(.8s*var(--r)) ease-in calc(4.4s*var(--r)) forwards}
  .tocando #empurra  {animation:empurrar calc(5.6s*var(--r)) cubic-bezier(.55,.02,.25,1) calc(4.2s*var(--r)) forwards}
  .tocando .vinheta  {animation:aparecer calc(3.4s*var(--r)) ease-in calc(4.4s*var(--r)) forwards}
  .tocando #foco     {animation:focoSegue calc(5.6s*var(--r)) cubic-bezier(.55,.02,.25,1) calc(4.2s*var(--r)) forwards,
                                aparecer calc(2.6s*var(--r)) ease-in calc(4.6s*var(--r)) forwards,
                                sumir calc(1.3s*var(--r)) ease-in-out calc(9.1s*var(--r)) forwards}
  .tocando #anel     {animation:anelAcompanha calc(5.6s*var(--r)) cubic-bezier(.55,.02,.25,1) calc(4.2s*var(--r)) forwards,
                                marcar calc(1.1s*var(--r)) cubic-bezier(.22,1,.36,1) calc(5.6s*var(--r)) forwards,
                                desmarcar calc(1.1s*var(--r)) ease-in calc(8.6s*var(--r)) forwards}
  .tocando #nitido   {animation:acompanhar calc(5.6s*var(--r)) cubic-bezier(.55,.02,.25,1) calc(4.2s*var(--r)) forwards,
                                revelar calc(1.1s*var(--r)) ease-out calc(5.9s*var(--r)) forwards,
                                assentar calc(1.6s*var(--r)) cubic-bezier(.22,1,.36,1) calc(9.8s*var(--r)) forwards}
  .tocando #brilho   {animation:florescer calc(2.2s*var(--r)) ease-out calc(10.0s*var(--r)) forwards}
  .tocando .aurora   {animation:nascer calc(2.4s*var(--r)) ease-out calc(10.0s*var(--r)) forwards, vagar calc(19s*var(--r)) ease-in-out calc(10.0s*var(--r)) infinite}
  .tocando #aro      {animation:aparecer calc(.4s*var(--r)) linear calc(10.6s*var(--r)) forwards}
  .tocando #aro circle{animation:desenhar calc(1.8s*var(--r)) cubic-bezier(.3,0,.2,1) calc(10.6s*var(--r)) forwards}
  .tocando .p1       {animation:sonar calc(4.2s*var(--r)) ease-out calc(11.4s*var(--r)) infinite}
  .tocando .p2       {animation:sonar calc(4.2s*var(--r)) ease-out calc(12.8s*var(--r)) infinite}
  .tocando .p3       {animation:sonar calc(4.2s*var(--r)) ease-out calc(14.2s*var(--r)) infinite}
  .tocando #regua    {animation:esticar calc(1.1s*var(--r)) ease-out calc(11.6s*var(--r)) forwards}
  .tocando #titulo   {animation:subir calc(1.1s*var(--r)) cubic-bezier(.22,1,.36,1) calc(11.8s*var(--r)) forwards}
  .tocando #frase    {animation:subir calc(1.1s*var(--r)) cubic-bezier(.22,1,.36,1) calc(13.1s*var(--r)) forwards}
  .tocando #rodape   {animation:subir calc(1.2s*var(--r)) cubic-bezier(.22,1,.36,1) calc(14.6s*var(--r)) forwards}
  .tocando #malha    {animation:aparecer calc(2.2s*var(--r)) ease-out calc(10.2s*var(--r)) forwards}
  .tocando #credito  {animation:creditar calc(1.4s*var(--r)) ease-out calc(15.2s*var(--r)) forwards}

  @keyframes sumir{to{opacity:0}}
  @keyframes aparecer{to{opacity:1}}
  @keyframes creditar{to{opacity:.85}}
  /* .45, nao .22: medido, o quadro caia pra 2 de 255 aos 8s - os vizinhos
     sumiam, e com eles o "voce e um entre milhares", que e o ponto da cena. */
  @keyframes apagar{to{filter:brightness(.45)}}
  @keyframes respirar{0%{transform:scale(1)} 100%{transform:scale(1.045)}}
  @keyframes varrer{0%{opacity:0;top:-5%} 10%{opacity:.85} 90%{opacity:.85} 100%{opacity:0;top:105%}}
  @keyframes revelar{0%{opacity:0} 100%{opacity:1}}
  @keyframes marcar{0%{opacity:0;transform:translate(-50%,-50%) scale(1.3)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes desmarcar{to{opacity:0; transform:translate(-50%,-50%) scale(1.07)}}
  @keyframes florescer{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)} 100%{opacity:.95;transform:translate(-50%,-50%) scale(1)}}
  @keyframes nascer{to{opacity:.85}}
  @keyframes vagar{0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(6%,-5%) scale(1.14)} 66%{transform:translate(-5%,4%) scale(.92)}}
  @keyframes desenhar{to{stroke-dashoffset:0}}
  @keyframes sonar{0%{opacity:0;transform:translate(-50%,-50%) scale(.52)} 12%{opacity:.55} 100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
  @keyframes esticar{0%{opacity:0;width:0} 100%{opacity:1;width:38em}}
  @keyframes subir{0%{opacity:0;transform:translateX(-50%) translateY(1.1em)} 100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes descer{to{opacity:0; transform:translateX(-50%) translateY(-.8em)}}
  /* empurrar / acompanhar / anelAcompanha / assentar sao gerados em JS,
     porque dependem da celula de cada um - ver montarKeyframes() */

  /* ======================= INTERFACE ======================= */
  #idiomas{gap:5px;}
  header{text-align:center; max-width:640px;}
  h1{font-size:1.5rem; font-weight:400; letter-spacing:.02em; color:#eaf3fb;}
  header p{font-size:.95rem; color:var(--fraco); margin-top:6px; line-height:1.5;}

  #painel{width:min(100%, 78vh); display:flex; flex-direction:column; gap:10px;}
  #solta{
    border:1px dashed rgba(86,120,160,.45); border-radius:10px;
    padding:18px; text-align:center; cursor:pointer; transition:.18s;
    background:rgba(20,28,40,.5);
  }
  #solta:hover,#solta.sobre{border-color:var(--ciano); background:rgba(var(--ac1),.08);}
  #solta b{color:#dcebf8; font-weight:400;}
  #solta span{display:block; font-size:.82rem; color:var(--fraco); margin-top:4px;}

  .acoes{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  button{
    font:inherit; font-family:inherit; cursor:pointer; color:#cfe4f7;
    background:rgba(var(--ac1),.12); border:1px solid rgba(var(--ac1),.3);
    border-radius:999px; padding:.45rem 1rem; font-size:.85rem;
  }
  button:hover{background:rgba(var(--ac1),.24)}
  button.secundario{background:transparent; border-color:rgba(86,120,160,.35); color:var(--fraco);}
  button:disabled{opacity:.45; cursor:default}

  #estado{font-size:.85rem; color:var(--fraco); text-align:center; min-height:1.2em;}

  /* escolha da célula */
  #escolha{display:none; background:rgba(12,18,26,.96); border:1px solid rgba(86,120,160,.25);
    border-radius:10px; padding:14px;}
  #escolha.aberto{display:block}
  #escolha h2{font-size:.95rem; font-weight:400; color:#e3eff9; margin-bottom:4px;}
  #escolha p{font-size:.8rem; color:var(--fraco); margin-bottom:10px; line-height:1.45;}
  #grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px;}
  #grade figure{cursor:pointer; border:2px solid transparent; border-radius:8px; overflow:hidden; background:#000;}
  #grade figure:hover{border-color:var(--ciano)}

<script>
"use strict";

/* ===================================================================
   GEOMETRIA

   Uma celula na linha L, coluna C de uma grade nc x nl tem centro em
       fx = (C + 0.5) / nc     fy = (L + 0.5) / nl
   da imagem. Com transform-origin:0 0, manter esse ponto no centro do
   palco enquanto escala por k exige
       tx = (0.5 - fx*k) * 100%        ty = (0.5 - fy*k) * 100%

   E a celula ocupa 100/n % do quadro por unidade de escala, entao a
   largura do logotipo nitido em cada passo e isso vezes k. Como largura
   e linear em k, e como as marcas de keyframe sao AS MESMAS do zoom com
   o mesmo easing, o logotipo fica grudado na celula em vez de escorregar.
   (O CSS aplica o easing DENTRO de cada trecho entre marcas; marcas
   diferentes divergem no meio do trecho mesmo com extremos iguais.)
   =================================================================== */

const MARCAS = [0, 28, 64, 100];
const FRACOES = [1, 0.15625, 0.4375, 1];   // k relativo, nas marcas acima

/**
 * Monta as keyframes do zoom para a celula (linha, coluna).
 *
 * O deslocamento e LIMITADO as bordas da imagem, como num visualizador de
 * mapa. Sem isso, uma celula perto da borda faz a camera olhar pra fora do
 * mosaico e o quadro enche de preto - medido na celula do VILIGION, que e a
 * 4a de baixo pra cima: o vazio aparecia durante os dois primeiros tercos da
 * aproximacao. E a maioria dos ~3.000 projetos esta perto de alguma borda.
 *
 * Com o limite, a celula deixa de ficar sempre no centro: ela entra pelo
 * canto, desliza pro meio conforme o zoom fecha, e so no fim fica centrada
 * (quando a area visivel e pequena o bastante pra nao tocar as bordas).
 * Por isso o anel, o logotipo nitido e o escurecimento precisam SEGUIR a
 * posicao real da celula na tela, nao assumir o centro.
 */
function montarKeyframes(linha, coluna, nc, nl){
  const fx = (coluna + 0.5) / nc, fy = (linha + 0.5) / nl;
  const kmax = 0.29 * nc;                   // celula termina com 29% do quadro
  const ks = [1, kmax*FRACOES[1], kmax*FRACOES[2], kmax];
  const celula = 100 / nc;

  const passo = (i) => {
    const k = ks[i];
    // u = quanto a imagem escorrega pra esquerda/cima, em telas.
    // Centrar a celula pede u = f*k - 0.5; as bordas pedem 0 <= u <= k-1.
    const ux = Math.max(0, Math.min(fx*k - 0.5, k - 1));
    const uy = Math.max(0, Math.min(fy*k - 0.5, k - 1));
    return {
      m: MARCAS[i],
      tx: (-ux * 100).toFixed(3),
      ty: (-uy * 100).toFixed(3),
      k: k.toFixed(5),
      // onde a celula realmente cai na tela, depois do limite
      sx: ((fx*k - ux) * 100).toFixed(3),
      sy: ((fy*k - uy) * 100).toFixed(3),
      w: (celula * k).toFixed(3),
      a: (celula * k * 1.18).toFixed(3),
    };
  };
  const p = [0,1,2,3].map(passo);
  const ultimo = p[3];

  return `
@keyframes empurrar{
  ${p.map(s => `${s.m}%{transform:translate(${s.tx}%, ${s.ty}%) scale(${s.k})}`).join("\n  ")}
}
@keyframes acompanhar{ ${p.map(s => `${s.m}%{width:${s.w}%; left:${s.sx}%; top:${s.sy}%}`).join(" ")} }
@keyframes anelAcompanha{ ${p.map(s => `${s.m}%{width:${s.a}%; height:${s.a}%; left:${s.sx}%; top:${s.sy}%}`).join(" ")} }
@keyframes focoSegue{ ${p.map(s => `${s.m}%{left:${s.sx}%; top:${s.sy}%}`).join(" ")} }
@keyframes assentar{
  0%  {width:${ultimo.w}%; left:${ultimo.sx}%; top:${ultimo.sy}%}
  100%{width:42%; left:50%; top:38%}
}
#anel{width:${p[0].a}%; height:${p[0].a}%; left:${p[0].sx}%; top:${p[0].sy}%}
#nitido{width:${p[0].w}%; left:${p[0].sx}%; top:${p[0].sy}%}
#foco{left:${p[0].sx}%; top:${p[0].sy}%}
`;
}

/* ===================================================================
   LOCALIZADOR

   Porque isto existe: animar um zoom e facil; achar sua celula entre
   ~3.000 nao e - e sem isso o modelo nao serve, porque todo numero da
   animacao depende de onde ela esta.
   =================================================================== */

function medias(dados, largura, altura){
  const col = new Float64Array(largura), lin = new Float64Array(altura);
  for (let y = 0; y < altura; y++){
    let soma = 0;
    for (let x = 0; x < largura; x++){
      const i = (y*largura + x) * 4;
      const v = (dados[i]*0.299 + dados[i+1]*0.587 + dados[i+2]*0.114);
      col[x] += v; soma += v;
    }
    lin[y] = soma / largura;
  }
  for (let x = 0; x < largura; x++) col[x] /= altura;
  return { col, lin };
}

/*
 * Descobre a grade testando qual divisao poe as calhas nos pixels mais
 * escuros. Autocorrelacao era o caminho obvio e respondeu 54 para uma grade
 * de 55 - e uma coluna a menos nao falha com elegancia: o desalinhamento
 * acumula ate os recortes pegarem duas celulas, e ai nada casa com nada.
 */
function detectarGrade(col, lin, L, A){
  /*
   * Colunas e linhas sao detectadas SEPARADAMENTE, de proposito.
   * A primeira versao devolvia um numero so e assumia grade quadrada. Um
   * mosaico de 4096x3948 encontrado em 24/10 tinha 55 colunas por 53 linhas
   * com celulas quadradas - ali a versao antiga alinhava as colunas e
   * desalinhava as linhas progressivamente, e nada casava.
   */
  const varrer = (perfil, tam) => {
    let melhor = null, segundo = null;
    for (let n = 20; n <= 140; n++){
      let soma = 0, qtd = 0;
      for (let i = 1; i < n; i++){
        const x = Math.round(i*tam/n);
        if (x > 0 && x < tam){ soma += perfil[x] + perfil[x-1]; qtd += 2; }
      }
      if (!qtd) continue;
      const v = soma / qtd;
      if (!melhor || v < melhor.v){ segundo = melhor; melhor = { v, n }; }
      else if (!segundo || v < segundo.v){ segundo = { v, n }; }
    }
    return { n: melhor.n, conf: segundo ? segundo.v / melhor.v : 0 };
  };
  const c = varrer(col, L), l = varrer(lin, A);
  return { nc: c.n, nl: l.n, confianca: Math.min(c.conf, l.conf) };
}

function normalizar(a){
  let s = 0; for (let i = 0; i < a.length; i++) s += a[i];
  const m = s / a.length;
  let v = 0; for (let i = 0; i < a.length; i++){ const d = a[i]-m; v += d*d; }
  const dp = Math.sqrt(v/a.length) + 1e-9;
  const out = new Float64Array(a.length);
  for (let i = 0; i < a.length; i++) out[i] = (a[i]-m)/dp;
  return out;
}

/** Desenha a imagem numa grade de nc x nl celulas de `lado` e le os pixels uma vez so. */
function amostrar(img, nc, nl, lado){
  const c = document.createElement("canvas");
  c.width = nc * lado; c.height = nl * lado;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  g.drawImage(img, 0, 0, c.width, c.height);
  return g.getImageData(0, 0, c.width, c.height).data;
}

function blocoCinza(dados, largura, cx, cy, lado){
  const out = new Float64Array(lado*lado);
  for (let y = 0; y < lado; y++)
    for (let x = 0; x < lado; x++){
      const i = ((cy*lado + y)*largura + cx*lado + x) * 4;
      out[y*lado + x] = dados[i]*0.299 + dados[i+1]*0.587 + dados[i+2]*0.114;
    }
  return out;
}
function blocoCor(dados, largura, cx, cy, lado){
  const out = new Float64Array(lado*lado*3);
  let j = 0;
  for (let y = 0; y < lado; y++)
    for (let x = 0; x < lado; x++){
      const i = ((cy*lado + y)*largura + cx*lado + x) * 4;
      out[j++] = dados[i]; out[j++] = dados[i+1]; out[j++] = dados[i+2];
    }
  return out;
}

/**
 * Variantes do gabarito. Recortes porque alguns mosaicos acolchoam a arte
 * dentro da celula; fundo preto E branco porque um PNG transparente nao diz
 * qual dos dois a Colosseum usou ao montar o mosaico, e errar isso sozinho
 * faz o casamento despencar.
 */
/**
 * Variantes do gabarito, varrendo ESCALA nos dois sentidos.
 *
 * A primeira versao so recortava a arte para dentro (0%, 5%, 10%), ou seja,
 * cobria apenas o caso em que a celula esta mais justa que o arquivo. O caso
 * inverso - arquivo colado na borda, celula montada com folga - ficava de
 * fora, e e o mais comum na pratica.
 *
 * Medido em 60 logotipos com 18% de diferenca de enquadramento: acerto em
 * primeiro lugar subiu de 13% para 45%, e "aparecer entre as 12 mostradas"
 * de 23% para 58%.
 *
 * O peso existe porque mais variantes dao mais chance de uma celula errada
 * ter sorte em alguma delas: sem ele, o caso facil caia de 100% para 97%.
 * A escala natural ganha o empate; as extremas so vencem quando vencem de
 * verdade.
 *
 * Os dois fundos continuam porque um PNG transparente nao diz qual deles a
 * Colosseum usou ao montar o mosaico.
 */
const ESCALAS = [[1.18,0.985],[1.0,1.0],[0.85,0.99],[0.72,0.975],[0.60,0.96]];

function gabaritos(logo){
  const base = document.createElement("canvas");
  base.width = base.height = 128;
  const bg = base.getContext("2d", { willReadFrequently: true });

  const reduzir = (lado) => {
    const c = document.createElement("canvas");
    c.width = c.height = lado;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.imageSmoothingQuality = "high";
    g.drawImage(base, 0, 0, lado, lado);
    return g.getImageData(0, 0, lado, lado).data;
  };

  const saida = [];
  for (const fundo of ["#000", "#fff"]){
    for (const [s, peso] of ESCALAS){
      bg.fillStyle = fundo; bg.fillRect(0, 0, 128, 128);
      const lado = Math.round(128*s), o = Math.round((128 - lado)/2);
      bg.drawImage(logo, o, o, lado, lado);
      saida.push({
        cinza: normalizar(blocoCinza(reduzir(32), 32, 0, 0, 32)),
        cor:   normalizar(blocoCor(reduzir(16), 16, 0, 0, 16)),
        peso,
      });
    }
  }
  return saida;   // 2 fundos x 5 escalas = 10 variantes
}

function produto(a, b){
  let s = 0; for (let i = 0; i < a.length; i++) s += a[i]*b[i];
  return s / a.length;
}

/** Amostras do mosaico em uso, reaproveitadas por `acharParecidos`. */
let amostras = null;

function procurar(img, nc, nl, logo, quantos){
  const dC = amostrar(img, nc, nl, 32), largC = nc*32;
  const dR = amostrar(img, nc, nl, 16), largR = nc*16;
  amostras = { nc, nl, dC, dR };
  const gabs = gabaritos(logo);

  const achados = [];
  for (let l = 0; l < nl; l++)
    for (let c = 0; c < nc; c++){
      const cinza = normalizar(blocoCinza(dC, largC, c, l, 32));
      const cor   = normalizar(blocoCor(dR, largR, c, l, 16));
      let melhor = -2;
      for (const g of gabs){
        const s = (produto(cinza, g.cinza)*0.5 + produto(cor, g.cor)*0.5) * g.peso;
        if (s > melhor) melhor = s;
      }
      achados.push({ s: melhor, l, c });
    }
  achados.sort((a, b) => b.s - a.s);
  return achados.slice(0, quantos);
}

/** Idioma inicial pelo navegador: quem chega do Japao cai em japones. */
let idioma = (() => {
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("zh")) return "zh";
  if (n.startsWith("ja")) return "ja";
  return "en";
})();

/** Texto traduzido, com substituicao simples de {chave}. */
function T(chave, vals){
  const d = IDIOMAS[idioma] || IDIOMAS.en;
  let s = d[chave] !== undefined ? d[chave] : (IDIOMAS.en[chave] !== undefined ? IDIOMAS.en[chave] : chave);
  if (vals) for (const k in vals) s = s.split("{" + k + "}").join(vals[k]);
  return s;
}

}

/** Claro ou escuro: um logotipo feito para fundo branco lavaria a tela
 *  inteira se recebesse mix-blend-mode:screen, entao ele ganha cartao proprio. */
function ajustarFundo(img){
  const c = document.createElement("canvas");
  c.width = c.height = 48;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, 48, 48);
  const d = g.getImageData(0, 0, 48, 48).data;
  let soma = 0, peso = 0;
  for (let i = 0; i < d.length; i += 4){
    const a = d[i+3]/255;
    soma += (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) * a; peso += a;
  }
  const brilho = peso > 0 ? soma/peso : 0;
  nitido.className = brilho > 118 ? "claro" : "escuro";
}

function mostrarCandidatas(lista, nc, nl){
  const grade = $("grade");
  grade.innerHTML = "";
  const px = mosaico.naturalWidth / nc, py = mosaico.naturalHeight / nl;
  const c = document.createElement("canvas");
  c.width = Math.round(px); c.height = Math.round(py);
  const g = c.getContext("2d");
  lista.forEach((cand, i) => {
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(mosaico, Math.round(cand.c*px), Math.round(cand.l*py),
                c.width, c.height, 0, 0, c.width, c.height);
    const fig = document.createElement("figure");
    const im = document.createElement("img"); im.src = c.toDataURL();
    const cap = document.createElement("figcaption"); cap.textContent = `#${i+1} · ${cand.l},${cand.c}`;
    fig.append(im, cap);
    fig.onclick = () => {
      celula = { linha: cand.l, coluna: cand.c, nc, nl };
      $("escolha").classList.remove("aberto");
      $("reabrir").disabled = false;
      estado.textContent = T("usando", { l: cand.l, c: cand.c });
      retribuir(!!logoAtual);
      confirmar("miniatura");
      $("verParecidos").disabled = false;
      tocar();
    };
    grade.appendChild(fig);
  });
  $("escolha").classList.add("aberto");
}

async function usarLogo(arquivo){
  if (!arquivo || !arquivo.type.startsWith("image/")) return;
  estado.textContent = T("lendo");
  const url = await new Promise((r) => {
    const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(arquivo);
  });
  const img = new Image();
  await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });

  logoAtual = img;
  nitido.src = url;
  ajustarFundo(img);
  await buscar(img);
}

async function buscar(img){
  estado.textContent = T("buscando");
  // deixa a interface pintar antes de travar a thread com a busca
  await new Promise((r) => setTimeout(r, 30));

  const t0 = performance.now();
  let pixels;
  try {
    pixels = (() => {
      const c = document.createElement("canvas");
      c.width = mosaico.naturalWidth; c.height = mosaico.naturalHeight;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(mosaico, 0, 0);
      return g.getImageData(0, 0, c.width, c.height).data;
    })();
  } catch (err) {
    /*
     * Chrome recusa ler pixels de uma imagem carregada por file://, mesmo da
     * mesma pasta. Entao abrir o index.html com dois cliques nao funciona - e
     * a mensagem nativa ("tainted canvas") nao diz isso a ninguem.
     */
    estado.textContent = T("erroDisco");
    return;
  }
  const { col, lin } = medias(pixels, mosaico.naturalWidth, mosaico.naturalHeight);

  const grade = detectarGrade(col, lin, mosaico.naturalWidth, mosaico.naturalHeight);
  const lista = procurar(mosaico, grade.nc, grade.nl, img, 12);
  const ms = Math.round(performance.now() - t0);

  gradeAtual = { nc: grade.nc, nl: grade.nl };
  $("mc").placeholder = "0–" + (grade.nc - 1);
  $("ml").placeholder = "0–" + (grade.nl - 1);
  // O palco e 1:1 e o mosaico e esticado pra preenche-lo. Se a imagem nao for
  // quadrada isso deforma, e e melhor dizer do que deixar a pessoa estranhar.
  const razao = mosaico.naturalWidth / mosaico.naturalHeight;
  const torto = Math.abs(razao - 1) > 0.02
    ? " · " + T("esticado", { r: razao.toFixed(2) })
    : "";
  estado.textContent = `${grade.nc}×${grade.nl} (${grade.confianca.toFixed(1)}×)`
    + (grade.confianca < 1.8 ? " " + T("confBaixa") : "")
    + ` · ${T("buscouEm", { ms })}${torto} · ` + T("escolhaSua");
  mostrarCandidatas(lista, grade.nc, grade.nl);
}

/*
 * Dois mosaicos porque existem dois: o oficial da Colosseum (55x55) e um
 * montado pela comunidade (55x53). Nem todo projeto esta nos dois, entao
 * quem nao se acha num tenta o outro.
 *
 * O segundo so e baixado quando escolhido - carregar os dois de saida
 * dobraria o peso da pagina para quem vai usar so um.
 */
let mosaicoAtual = "assets/mosaico.jpg";

/*
 * Tamanho da grade do mosaico em uso.
 *
 * Isto existe porque a versao anterior lia a faixa valida DOS PLACEHOLDERS
 * dos campos de linha/coluna - que comecam com "51" e "39", o exemplo. Antes
 * de qualquer busca, digitar a mao recusava tudo acima de 0-50 / 0-38, ou
 * seja, recusava ate a celula do proprio exemplo. Placeholder e dica visual,
 * nao estado.
 */
let gradeAtual = { nc: 55, nl: 55 };

/* ===================================================================
   LEMBRAR A CELULA

   Um usuario relatou ter encontrado o logo dele DUAS VEZES, em lugares
   diferentes. Conferido: o mosaico tem mesmo entradas repetidas - 84 pares
   de celulas quase identicas, varios deles lado a lado. Ou seja, a
   ferramenta estava certa e a duvida era legitima.

   Entao a pagina passa a guardar qual celula a pessoa confirmou, no proprio
   aparelho, pra ela nao precisar decidir de novo a cada visita.

   Fica em localStorage, que e por navegador e nunca sai dele - nada aqui
   contradiz o "nada e enviado" que a pagina promete. Toda leitura e escrita
   vai em try/catch: em aba anonima, com dados bloqueados ou cota cheia, o
   acesso lanca, e a pagina tem que continuar funcionando sem isso.
   =================================================================== */
const CHAVE = "colosseum-opening/celula";
const LIMITE_LOGO = 2_000_000;   // acima disso a cota costuma estourar

function guardar(dados){
  try { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
  catch { /* cota cheia ou armazenamento bloqueado: seguir sem lembrar */ }
}
function recuperar(){
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (!bruto) return null;
    const d = JSON.parse(bruto);
    return (d && Number.isInteger(d.linha) && Number.isInteger(d.coluna)) ? d : null;
  } catch { return null; }
}
function esquecer(){
  try { localStorage.removeItem(CHAVE); } catch { /* idem */ }
  $("voltar").classList.remove("aberto");
}

/** Chamado toda vez que a pessoa CONFIRMA uma celula - clicando ou digitando. */
function confirmar(origem){
  const d = { ...celula, mosaico: mosaicoAtual, quando: Date.now() };
  const src = nitido.getAttribute("src") || "";
  if (src.startsWith("data:") && src.length < LIMITE_LOGO) { d.logo = src; d.classe = nitido.className; }
  d.origem = origem;
  guardar(d);
}

async function restaurar(d){
  if (d.mosaico && d.mosaico !== mosaicoAtual) {
    mosaicoAtual = d.mosaico;
    [...$("mosaicos").querySelectorAll("button")].forEach(b => b.classList.toggle("sel", b.dataset.m === d.mosaico));
    mostrarCarregando(true);
    await carregarMosaico(mosaicoAtual, preencher);
    mostrarCarregando(false);
  }
  celula = { linha: d.linha, coluna: d.coluna, nc: d.nc || 55, nl: d.nl || 55 };
  gradeAtual = { nc: celula.nc, nl: celula.nl };
  if (d.logo) { nitido.src = d.logo; nitido.className = d.classe || "escuro"; retribuir(true); }
  $("voltar").classList.remove("aberto");
  estado.textContent = T("restaurado", { l: celula.linha, c: celula.coluna });
  tocar();
}

/* ===================================================================
   LOGOS PARECIDOS

   Compara a SUA celula com todas as outras do mosaico - nao o arquivo que
   voce enviou, mas a celula que voce confirmou, que e a forma como o mosaico
   de fato te renderizou.

   Serve a duas coisas. Primeiro, explica o relato de "achou o meu duas
   vezes": medido, este mosaico tem 84 pares de celulas quase identicas, e
   varios sao projetos listados em duplicidade. Segundo, mostra quem escolheu
   uma identidade visual parecida com a sua, que e informacao util pra quem
   esta posicionando um produto.

   O que isto NAO e: parecer sobre marca. E semelhanca visual a 32x32, e o
   texto na tela diz isso.
   =================================================================== */
const LIMIAR_PARECIDO = 0.80;

async function acharParecidos(quantos = 12){
  const { nc, nl } = gradeAtual;
  if (!amostras || amostras.nc !== nc || amostras.nl !== nl) {
    amostras = { nc, nl, dC: amostrar(mosaico, nc, nl, 32), dR: amostrar(mosaico, nc, nl, 16) };
  }
  const { dC, dR } = amostras;
  const alvoC = normalizar(blocoCinza(dC, nc*32, celula.coluna, celula.linha, 32));
  const alvoR = normalizar(blocoCor(dR, nc*16, celula.coluna, celula.linha, 16));

  const achados = [];
  for (let l = 0; l < nl; l++)
    for (let c = 0; c < nc; c++){
      if (l === celula.linha && c === celula.coluna) continue;
      const s = produto(alvoC, normalizar(blocoCinza(dC, nc*32, c, l, 32))) * 0.5
              + produto(alvoR, normalizar(blocoCor(dR, nc*16, c, l, 16))) * 0.5;
      if (s >= LIMIAR_PARECIDO) achados.push({ s, l, c });
    }
  achados.sort((a, b) => b.s - a.s);
  return achados.slice(0, quantos);
}

function mostrarParecidos(lista){
  const caixa = $("listaParecidos");
  caixa.innerHTML = "";
  if (!lista.length) {
    caixa.innerHTML = `<p style="grid-column:1/-1">${T("parecidosNada")}</p>`;
  } else {
    const { nc, nl } = gradeAtual;
    const px = mosaico.naturalWidth / nc, py = mosaico.naturalHeight / nl;
    const cv = document.createElement("canvas");
    cv.width = Math.round(px); cv.height = Math.round(py);
    const g = cv.getContext("2d");
    for (const p of lista){
      g.clearRect(0, 0, cv.width, cv.height);
      g.drawImage(mosaico, Math.round(p.c*px), Math.round(p.l*py), cv.width, cv.height, 0, 0, cv.width, cv.height);
      const rotulo = p.s >= 0.93 ? T("selIdentico") : p.s >= 0.85 ? T("selMuito") : T("selParecido");
      const fig = document.createElement("figure");
      const im = document.createElement("img"); im.src = cv.toDataURL();
      const cap = document.createElement("figcaption");
      cap.textContent = `${Math.round(p.s*100)}% · ${rotulo} · ${p.l},${p.c}`;
      if (p.s >= 0.93) cap.className = "ident";
      fig.append(im, cap);
      caixa.appendChild(fig);
    }
  }
  $("parecidos").classList.add("aberto");
}

/* ===================================================================
   GRAVAR O VIDEO

   Eu tinha afirmado que isto exigiria reescrever a animacao em canvas e que
   so sairia WebM, que o X costuma recusar. Conferido no Chrome atual: errado
   nos dois pontos. `MediaRecorder` aceita video/mp4;codecs=avc1, e
   `getDisplayMedia` entrega a aba sem precisar de reescrita nenhuma.

   O caminho e: capturar a aba -> desenhar so o retangulo do palco num canvas
   quadrado -> gravar esse canvas. Assim a saida sai 1:1 de verdade, sem as
   tarjas pretas que uma captura de tela cheia deixaria, e sem a barra de
   controles aparecer.

   O recorte e recalculado a cada quadro de proposito: se a pessoa rolar a
   pagina no meio da gravacao, o palco se move, e um retangulo fixo passaria
   a gravar o lugar errado.
   =================================================================== */
const FORMATOS = [
  ["video/mp4;codecs=avc1", "mp4"],
  ["video/mp4", "mp4"],
  ["video/webm;codecs=vp9", "webm"],
  ["video/webm", "webm"],
];

function formatoDisponivel(){
  if (typeof MediaRecorder === "undefined") return null;
  for (const [mime, ext] of FORMATOS) if (MediaRecorder.isTypeSupported(mime)) return { mime, ext };
  return null;
}

function podeGravar(){
  return !!(navigator.mediaDevices?.getDisplayMedia && formatoDisponivel() &&
            HTMLCanvasElement.prototype.captureStream);
}

async function gravar(){
  const fmt = formatoDisponivel();
  estado.textContent = T("preparandoGrav");

  let fonte;
  try {
    fonte = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 },
      audio: false,
      preferCurrentTab: true,        // so o Chrome entende; os outros ignoram
    });
  } catch {
    estado.textContent = T("gravCancel");   // a pessoa fechou o seletor
    return;
  }

  const video = document.createElement("video");
  video.srcObject = fonte;
  video.muted = true;
  await video.play();

  const LADO = 1080;
  const tela = document.createElement("canvas");
  tela.width = tela.height = LADO;
  const g = tela.getContext("2d");
  const escala = video.videoWidth / window.innerWidth;

  let rodando = true;
  const desenhar = () => {
    if (!rodando) return;
    const r = palco.getBoundingClientRect();   // recalculado: a pagina pode rolar
    g.drawImage(video, r.x * escala, r.y * escala, r.width * escala, r.height * escala,
                0, 0, LADO, LADO);
    requestAnimationFrame(desenhar);
  };
  desenhar();

  const pedacos = [];
  const rec = new MediaRecorder(tela.captureStream(30), {
    mimeType: fmt.mime,
    videoBitsPerSecond: 8_000_000,
  });
  rec.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };

  const pronto = new Promise((r) => (rec.onstop = r));
  rec.start();
  tocar();                                   // reinicia do zero pra gravar inteiro

  const ritmo = parseFloat(getComputedStyle(palco).getPropertyValue("--r")) || 1;
  const total = Math.ceil(18.4 * ritmo);
  for (let s = total; s > 0; s--) {
    estado.textContent = T("gravando", { s });
    await new Promise((r) => setTimeout(r, 1000));
  }

  rec.stop();
  rodando = false;
  fonte.getTracks().forEach((t) => t.stop());
  await pronto;

  const blob = new Blob(pedacos, { type: fmt.mime });
  const nome = `colosseum-opening.${fmt.ext}`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
  estado.textContent = T("gravOk", { f: nome, mb: (blob.size / 1048576).toFixed(1) });
}

/**
 * Baixa o mosaico mostrando progresso de verdade.
 *
 * `img.src = url` nao diz quanto falta, e sao 2 MB: o visitante ficaria
 * olhando pra nada sem saber se a pagina travou. Com fetch da pra ler o
 * corpo em pedacos e contar - e quando o servidor nao manda
 * content-length, a barra simplesmente nao se move, o que ainda e melhor
 * que ausencia de sinal.
 */
async function carregarMosaico(url, aoProgredir){
  try {
    const resp = await fetch(url);
    if (!resp.ok || !resp.body) throw new Error("sem corpo");
    const total = +(resp.headers.get("content-length") || 0);
    const leitor = resp.body.getReader();
    const pedacos = [];
    let lido = 0;
    for (;;) {
      const { done, value } = await leitor.read();
      if (done) break;
      pedacos.push(value);
      lido += value.length;
      if (total) aoProgredir(lido / total);
    }
    const blob = new Blob(pedacos, { type: resp.headers.get("content-type") || "image/jpeg" });
    const objeto = URL.createObjectURL(blob);
    await new Promise((r, j) => { mosaico.onload = r; mosaico.onerror = j; mosaico.src = objeto; });
    aoProgredir(1);
  } catch {
    // Qualquer tropeco (fetch barrado, file://, servidor estranho) cai no
    // caminho simples: sem barra, mas a imagem carrega.
    await new Promise((r) => { mosaico.onload = mosaico.onerror = r; mosaico.src = url; });
  }
}
