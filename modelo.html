<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colosseum — opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* =======================================================================
     Generated by gerar.py — do not hand-edit the numbers below unless you
     know what they mean; re-run the script instead.

     YOUR TILE: row {{LINHA}}, column {{COLUNA}} of a {{GRADE}} grid,
     whose centre sits at {{FX}}% / {{FY}}% of the mosaic.

     Everything follows from those two fractions:

     1. The camera push. With transform-origin:0 0, holding that point in the
        centre of the frame requires
            tx = (0.5 - {{FX}}/100 * k) * 100%
            ty = (0.5 - {{FY}}/100 * k) * 100%
        evaluated at each zoom step k.

     2. The sharp logo. A cell occupies {{W1}}% of the frame
        per unit of scale, so the logo's width at each step is that times k.
        Because width is linear in k, and because the width keyframes sit at
        the SAME percentages as the zoom keyframes (0 / 28 / 64 / 100) with
        the same easing, the sharp logo stays locked to the cell it replaces
        instead of sliding against it.

        That matters: the point is to show your logo legibly from the moment
        it is found, never as a pixelated 46px square.
     ======================================================================= */
  :root{ --ciano:#38bdf8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000; color:#fff;
    font-family:"Jost",system-ui,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  /* square stage: 1:1, which is what performs on X */
  #palco{
    position:relative; overflow:hidden; background:#000;
    width:min(100vw,100vh); height:min(100vw,100vh);
    font-size:calc(min(100vw,100vh) / 100);
  }

  /* ---------- 1. the mosaic ---------- */
  #camera{position:absolute; inset:0; transform-origin:50% 50%;}
  #empurra{position:absolute; inset:0; transform-origin:0 0;}
  #mosaico{width:100%; height:100%; display:block;}
  /* 3x o palco e centrado na celula, pra o "buraco" claro segui-la mesmo
     quando o limite de borda a tira do centro da tela. */
  #foco{
    position:absolute; left:{{SX1}}%; top:{{SY1}}%; width:300%; height:300%;
    transform:translate(-50%,-50%); opacity:0; pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      rgba(0,0,0,.30) 0%, rgba(0,0,0,.62) 6%, rgba(0,0,0,.90) 14%, rgba(0,0,0,.96) 34%);
  }
  /* 1.18x the cell, and it grows WITH the cell — at a fixed size the cell
     simply grows through it */
  #anel{
    position:absolute; left:{{SX1}}%; top:{{SY1}}%; width:{{A1}}%; height:{{A1}}%;
    transform:translate(-50%,-50%);
    border:.2em solid rgba(56,189,248,.95); border-radius:9%; opacity:0;
    box-shadow:0 0 2.2em rgba(56,189,248,.55), inset 0 0 1.6em rgba(56,189,248,.2);
  }
  .varredura{
    position:absolute; left:0; right:0; height:2px; top:-5%; opacity:0;
    background:linear-gradient(90deg,transparent,var(--ciano),transparent);
    filter:blur(1.5px); box-shadow:0 0 2.5em rgba(56,189,248,.5);
  }

  /* ---------- 2. background of the end card ---------- */
  .aurora{position:absolute; border-radius:50%; opacity:0; pointer-events:none;
    filter:blur(6em); mix-blend-mode:screen;}
  #aurora1{left:22%; top:26%; width:52em; height:52em; background:radial-gradient(circle,rgba(37,99,235,.55),transparent 65%);}
  #aurora2{left:70%; top:48%; width:44em; height:44em; background:radial-gradient(circle,rgba(56,189,248,.42),transparent 65%);}

  .pulso{
    position:absolute; left:50%; top:38%; width:30em; height:30em;
    transform:translate(-50%,-50%) scale(.5);
    border:1px solid rgba(56,189,248,.5); border-radius:50%;
    opacity:0; pointer-events:none;
  }
  /* ring that draws itself, like a loading indicator. r=24 around a logo box
     that reaches 59% keeps it clear of the text below. */
  #aro{position:absolute; inset:0; opacity:0; pointer-events:none;}
  #aro circle{
    fill:none; stroke:url(#grad); stroke-width:.45; stroke-linecap:round;
    stroke-dasharray:150.80; stroke-dashoffset:150.80;
    transform:rotate(-90deg); transform-origin:50px 38px;
    filter:drop-shadow(0 0 1px rgba(56,189,248,.9));
  }
  #brilho{
    position:absolute; left:50%; top:38%; width:78em; height:78em;
    transform:translate(-50%,-50%) scale(.55); opacity:0; pointer-events:none;
    background:radial-gradient(circle, rgba(37,99,235,.42) 0%, rgba(56,189,248,.13) 36%, transparent 66%);
  }

  /* ---------- 3. the sharp logo ---------- */
  #nitido{
    position:absolute; left:{{SX1}}%; top:{{SY1}}%; width:{{W1}}%;
    transform:translate(-50%,-50%); opacity:0; {{ESTILO_LOGO}}
  }

  /* ---------- 4. text ---------- */
  .linha{position:absolute; left:50%; transform:translateX(-50%); text-align:center; opacity:0; white-space:nowrap;}
  #chapeu{top:7%; font-size:2em; font-weight:300; letter-spacing:.36em; text-indent:.36em; color:#9fb4c9; text-transform:uppercase;}
  #regua{top:66%; width:0; height:1px; background:linear-gradient(90deg,transparent,rgba(56,189,248,.8),transparent); opacity:0;}
  #titulo{top:70%; font-size:2.5em; font-weight:300; letter-spacing:.4em; text-indent:.4em; color:#dce7f5;}
  #frase{top:78%; font-size:1.7em; font-weight:200; letter-spacing:.1em; text-indent:.1em; color:#8296ad;}
  #rodape{top:90%; font-size:1.5em; font-weight:300; letter-spacing:.3em; text-indent:.3em; color:#55687f; text-transform:uppercase;}

  .vinheta{position:absolute; inset:0; z-index:7; pointer-events:none;
    background:radial-gradient(ellipse 78% 78% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%);}
  #cortina{position:absolute; inset:0; background:#000; opacity:1; z-index:9; pointer-events:none;}

  /* ===================== TIMELINE — about 18s ===================== */
  .tocando #cortina  {animation:sumir 1s ease-out 0s forwards, aparecer 1.6s ease-in 16.4s forwards}
  .tocando #camera   {animation:respirar 4.6s ease-in-out .6s forwards, sumir 1.3s ease-in-out 9.1s forwards}
  .tocando #mosaico  {animation:apagar 1.7s ease-in-out 5.9s forwards}
  .tocando .v1       {animation:varrer 2.3s cubic-bezier(.4,0,.2,1) 1.0s forwards}
  .tocando .v2       {animation:varrer 1.7s cubic-bezier(.4,0,.2,1) 2.6s forwards}
  .tocando #chapeu   {animation:subir 1.1s ease-out 1.2s forwards, descer .8s ease-in 4.4s forwards}
  .tocando #empurra  {animation:empurrar 5.6s cubic-bezier(.55,.02,.25,1) 4.2s forwards}
  .tocando #foco     {animation:focoSegue 5.6s cubic-bezier(.55,.02,.25,1) 4.2s forwards,
                                aparecer 2.6s ease-in 4.6s forwards,
                                sumir 1.3s ease-in-out 9.1s forwards}
  .tocando #anel     {animation:anelAcompanha 5.6s cubic-bezier(.55,.02,.25,1) 4.2s forwards,
                                marcar 1.1s cubic-bezier(.22,1,.36,1) 5.6s forwards,
                                desmarcar 1.1s ease-in 8.6s forwards}
  .tocando #nitido   {animation:acompanhar 5.6s cubic-bezier(.55,.02,.25,1) 4.2s forwards,
                                revelar 1.1s ease-out 5.9s forwards,
                                assentar 1.6s cubic-bezier(.22,1,.36,1) 9.8s forwards}
  .tocando #brilho   {animation:florescer 2.2s ease-out 10.0s forwards}
  .tocando .aurora   {animation:nascer 2.4s ease-out 10.0s forwards, vagar 19s ease-in-out 10.0s infinite}
  .tocando #aro      {animation:aparecer .4s linear 10.6s forwards}
  .tocando #aro circle{animation:desenhar 1.8s cubic-bezier(.3,0,.2,1) 10.6s forwards}
  .tocando .p1       {animation:sonar 4.2s ease-out 11.4s infinite}
  .tocando .p2       {animation:sonar 4.2s ease-out 12.8s infinite}
  .tocando .p3       {animation:sonar 4.2s ease-out 14.2s infinite}
  .tocando #regua    {animation:esticar 1.1s ease-out 11.6s forwards}
  .tocando #titulo   {animation:subir 1.1s cubic-bezier(.22,1,.36,1) 11.8s forwards}
  .tocando #frase    {animation:subir 1.1s cubic-bezier(.22,1,.36,1) 13.1s forwards}
  .tocando #rodape   {animation:subir 1.2s cubic-bezier(.22,1,.36,1) 14.6s forwards}

  @keyframes sumir{to{opacity:0}}
  @keyframes aparecer{to{opacity:1}}
  @keyframes apagar{to{filter:brightness(.22)}}
  @keyframes respirar{0%{transform:scale(1)} 100%{transform:scale(1.045)}}
  @keyframes varrer{0%{opacity:0;top:-5%} 10%{opacity:.85} 90%{opacity:.85} 100%{opacity:0;top:105%}}

  /* Deslocamento limitado as bordas do mosaico: centrar uma celula de borda
     faria a camera olhar pra fora da imagem e encher o quadro de preto. Por
     isso a celula nem sempre fica no centro, e o anel, o logotipo e o
     escurecimento seguem a posicao real dela (SX/SY). */
  @keyframes empurrar{
    0%   {transform:translate({{TX1}}%, {{TY1}}%) scale(1)}
    28%  {transform:translate({{TX2}}%, {{TY2}}%) scale({{K2}})}
    64%  {transform:translate({{TX3}}%, {{TY3}}%) scale({{K3}})}
    100% {transform:translate({{TX4}}%, {{TY4}}%) scale({{K4}})}
  }
  /* same keyframe marks as empurrar, on purpose — see the note at the top */
  @keyframes acompanhar{
    0%   {width:{{W1}}%; left:{{SX1}}%; top:{{SY1}}%}
    28%  {width:{{W2}}%; left:{{SX2}}%; top:{{SY2}}%}
    64%  {width:{{W3}}%; left:{{SX3}}%; top:{{SY3}}%}
    100% {width:{{W4}}%; left:{{SX4}}%; top:{{SY4}}%}
  }
  @keyframes focoSegue{
    0%   {left:{{SX1}}%; top:{{SY1}}%}
    28%  {left:{{SX2}}%; top:{{SY2}}%}
    64%  {left:{{SX3}}%; top:{{SY3}}%}
    100% {left:{{SX4}}%; top:{{SY4}}%}
  }
  @keyframes anelAcompanha{
    0%   {width:{{A1}}%; height:{{A1}}%; left:{{SX1}}%; top:{{SY1}}%}
    28%  {width:{{A2}}%; height:{{A2}}%; left:{{SX2}}%; top:{{SY2}}%}
    64%  {width:{{A3}}%; height:{{A3}}%; left:{{SX3}}%; top:{{SY3}}%}
    100% {width:{{A4}}%; height:{{A4}}%; left:{{SX4}}%; top:{{SY4}}%}
  }
  @keyframes revelar{0%{opacity:0} 100%{opacity:1}}
  @keyframes assentar{0%{width:{{W4}}%; left:{{SX4}}%; top:{{SY4}}%} 100%{width:42%; left:50%; top:38%}}

  @keyframes marcar{0%{opacity:0;transform:translate(-50%,-50%) scale(1.3)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes desmarcar{to{opacity:0; transform:translate(-50%,-50%) scale(1.07)}}
  @keyframes florescer{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)} 100%{opacity:.95;transform:translate(-50%,-50%) scale(1)}}
  @keyframes nascer{to{opacity:.85}}
  @keyframes vagar{0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(6%,-5%) scale(1.14)} 66%{transform:translate(-5%,4%) scale(.92)}}
  @keyframes desenhar{to{stroke-dashoffset:0}}
  @keyframes sonar{0%{opacity:0;transform:translate(-50%,-50%) scale(.52)} 12%{opacity:.55} 100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
  @keyframes esticar{0%{opacity:0;width:0} 100%{opacity:1;width:38em}}
  @keyframes subir{0%{opacity:0;transform:translateX(-50%) translateY(1.1em)} 100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes descer{to{opacity:0; transform:translateX(-50%) translateY(-.8em)}}

  /* controls live outside the stage and hide while playing, so they never
     end up in your screen recording */
  #barra{
    position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%);
    display:flex; gap:.55rem; align-items:center; z-index:50; font-size:.8rem;
    background:rgba(10,14,20,.9); border:1px solid rgba(86,120,160,.3);
    border-radius:999px; padding:.45rem .65rem; transition:opacity .4s;
  }
  #barra.sumir{opacity:0; pointer-events:none}
  #barra button{
    font:inherit; font-family:inherit; cursor:pointer; color:#cfe4f7;
    background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.3);
    border-radius:999px; padding:.4rem .9rem;
  }
  #barra button:hover{background:rgba(56,189,248,.24)}
  #barra span{color:#6d8099; padding:0 .35rem}
  :fullscreen #barra{display:none}
</style>
</head>
<body>

<div id="palco">
  <div id="camera">
    <div id="empurra"><img id="mosaico" src="mosaico.jpg" alt=""></div>
  </div>

  <div class="varredura v1"></div>
  <div class="varredura v2"></div>
  <div id="foco"></div>
  <div id="anel"></div>

  <div class="aurora" id="aurora1"></div>
  <div class="aurora" id="aurora2"></div>
  <div id="brilho"></div>
  <div class="pulso p1"></div>
  <div class="pulso p2"></div>
  <div class="pulso p3"></div>

  <svg id="aro" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#38bdf8"/>
        <stop offset="55%"  stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity=".25"/>
      </linearGradient>
    </defs>
    <circle cx="50" cy="38" r="24"/>
  </svg>

  <img id="nitido" src="logo.png" alt="">

  <div class="linha" id="chapeu">{{CHAPEU}}</div>
  <div class="linha" id="regua"></div>
  <div class="linha" id="titulo">{{TITULO}}</div>
  <div class="linha" id="frase">{{FRASE}}</div>
  <div class="linha" id="rodape">{{RODAPE}}</div>

  <div class="vinheta"></div>
  <div id="cortina"></div>
</div>

<div id="barra">
  <button id="tocar">▶ Play</button>
  <button id="tela">⛶ Fullscreen</button>
  <span>R = replay · F = fullscreen</span>
</div>

<script>
  const palco = document.getElementById("palco");
  const barra = document.getElementById("barra");
  let voltar;

  function tocar(){
    palco.classList.remove("tocando");
    void palco.offsetWidth;            // forces the animations to restart
    palco.classList.add("tocando");
    barra.classList.add("sumir");
    clearTimeout(voltar);
    voltar = setTimeout(() => barra.classList.remove("sumir"), 19000);
  }

  function telaCheia(){
    if (document.fullscreenElement) document.exitFullscreen();
    else palco.requestFullscreen?.();
  }

  document.getElementById("tocar").addEventListener("click", tocar);
  document.getElementById("tela").addEventListener("click", telaCheia);
  document.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") tocar();
    if (e.key === "f" || e.key === "F") telaCheia();
    if (e.key === " ") { e.preventDefault(); tocar(); }
  });
  addEventListener("mousemove", () => {
    if (!palco.classList.contains("tocando")) barra.classList.remove("sumir");
  });

  // wait for the images, otherwise the first second stutters
  Promise.all([...document.images].map(img =>
    img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })
  )).then(tocar);
</script>
</body>
</html>
